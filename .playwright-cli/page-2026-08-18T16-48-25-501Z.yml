  - main [ref=f5e8]:
    - generic [ref=f5e10]:
      - heading "FAQ" [level=2] [ref=f5e11]
      - paragraph [ref=f5e12]: The questions buyers ask most, answered straight. Anything else, just ask.
      - generic [ref=f5e13]:
        - heading "What is your minimum order quantity (MOQ)?" [level=3] [ref=f5e14]
        - paragraph [ref=f5e15]: It varies by product and by supplier. Tell me your quantity and I'll confirm the MOQ and price together.
      - generic [ref=f5e16]:
        - heading "How long does production take?" [level=3] [ref=f5e17]
        - paragraph [ref=f5e18]: It depends on the supplier and the process. Every quote comes with a dated schedule, and the shipping time is quoted right next to it.
      - generic [ref=f5e19]:
        - heading "What payment methods do you accept?" [level=3] [ref=f5e20]
        - paragraph [ref=f5e21]: "Bank transfer (T/T): 30% deposit to start production, 70% before shipment. Payments go to Yukfo Limited (Hong Kong). Sample costs are charged separately and deducted from your first production order. Repeat orders can negotiate different terms."
      - generic [ref=f5e22]:
        - heading "Do you charge for samples?" [level=3] [ref=f5e23]
        - paragraph [ref=f5e24]: "Small parts: I often cover the sample cost or charge only the cost price. Large parts (molds, rotomolded items) carry a sample/mold fee, credited back when you place a production order. I'll share the number up front."
      - generic [ref=f5e25]:
        - heading "How do I send you my drawings?" [level=3] [ref=f5e26]
        - paragraph [ref=f5e27]: STEP, IGES, DXF, DWG, PDF, or even a sketch photo. Send them through the contact form, email, WhatsApp or WeChat, and I'll confirm what I need within a day.
      - generic [ref=f5e28]:
        - heading "Do you make molds and tools?" [level=3] [ref=f5e29]
        - paragraph [ref=f5e30]: Yes. I develop injection and rotomolding molds with partner toolmakers, validate them with trial shots, then start production. You get mold drawings and a schedule.
      - generic [ref=f5e31]:
        - heading "Can you work with my existing molds?" [level=3] [ref=f5e32]
        - paragraph [ref=f5e33]: Yes. If you already own tooling, I'll quote production on your molds directly. Many clients transfer their existing molds to partner factories to reduce cost.
      - generic [ref=f5e34]:
        - heading "How do you control quality?" [level=3] [ref=f5e35]
        - paragraph [ref=f5e36]: "Three checkpoints: (1) samples approved by you before mass production, (2) in-process and final random inspection, (3) a pre-shipment report with photos. Third-party inspection available."
      - generic [ref=f5e37]:
        - heading "What happens if there is a quality problem?" [level=3] [ref=f5e38]
        - paragraph [ref=f5e39]: Problems are handled where they show up. If a sample fails, it goes back to the supplier with photos and measurements before anything continues. If inspection catches something mid-production, the fix is agreed before the next batch runs. Everything is documented with photos and test results, so there is a record of what was found and what was done about it.
      - generic [ref=f5e40]:
        - heading "Can you handle shipping and customs?" [level=3] [ref=f5e41]
        - paragraph [ref=f5e42]: Yes. Export documents, customs, sea or air freight to your port or door. I handle it.
      - generic [ref=f5e43]:
        - heading "How fast will you reply?" [level=3] [ref=f5e44]
        - paragraph [ref=f5e45]: Within 24 hours on working days. Every inquiry gets a direct answer.
    - generic [ref=f5e47]:
      - heading "Still Have a Question?" [level=2] [ref=f5e48]
      - paragraph [ref=f5e49]: Ask it directly. I'll answer personally within 24 hours.
